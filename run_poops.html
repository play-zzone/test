<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 poops</title>
<style>
  :root { --bg:#101a3c; --panel:rgba(31,48,101,.84); --line:rgba(93,151,255,.28); --text:#edf4ff; --cyan:#48caff; --violet:#8b6cff; }
  * { box-sizing:border-box; }
  html, body { min-height:100%; margin:0; background:radial-gradient(circle at 18% -15%,#3d6ed1 0,transparent 38%),radial-gradient(circle at 100% 100%,#704bb0 0,transparent 42%),var(--bg); color:var(--text); font:15px/1.5 "Segoe UI",system-ui,sans-serif; }
  #brand { display:flex; align-items:center; justify-content:center; gap:10px; min-height:66px; padding:11px 18px; background:rgba(16,26,60,.80); border-bottom:1px solid var(--line); box-shadow:0 8px 28px rgba(0,0,0,.25); backdrop-filter:blur(12px); }
  #brand img { width:38px; height:38px; border-radius:50%; filter:drop-shadow(0 0 9px rgba(72,202,255,.55)); }
  #brand b { color:#fff; font-size:17px; font-weight:800; letter-spacing:.18em; text-shadow:0 0 18px rgba(72,202,255,.45); }
  #wrap { max-width:900px; margin:28px auto; padding:24px; }
  #state { margin:0 0 13px; font-size:24px; font-weight:800; letter-spacing:.02em; }
  #out { height:calc(100vh - 176px); min-height:280px; overflow-y:auto; padding:15px; border:1px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:0 18px 48px rgba(4,8,28,.24),inset 0 1px 0 rgba(255,255,255,.05); color:#cddcff; font:12px/1.55 Consolas,"Courier New",monospace; }
  .ok { color:#65e8b8; } .bad { color:#ff8398; } .warn { color:#ffd16e; }
  #wrap { max-width:480px; margin:72px auto; text-align:center; }
  #state { margin:0; font-size:25px; }
  #det, #cache, #out { display:none !important; visibility:hidden !important; } body { min-height:100vh; display:flex; flex-direction:column; } #wrap { width:min(480px, calc(100% - 32px)); margin:auto; padding:28px 24px; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 48px rgba(4,8,28,.24); } #social { display:block; margin:20px 0 0; color:#d7e4ff; font-size:14px; } #social b { color:#fff; letter-spacing:.04em; } #social .tiktok { width:23px; height:23px; margin-left:6px; vertical-align:middle; filter:drop-shadow(0 0 5px rgba(72,202,255,.45)); } #version { position:fixed; right:0; bottom:18px; left:0; margin:0; color:#d8e5ff; font-size:12px; font-weight:700; letter-spacing:.12em; text-align:center; opacity:.9; }</style>
</head>

<div id="brand"><img src="logo_playzone.png" alt="" width="28" height="28"><b>PLAYZONE</b></div>

  <div id="out"></div>
  <p id="social"><svg class="tiktok" viewBox="0 0 24 24" aria-label="TikTok" role="img"><path fill="#25F4EE" d="M14 3v11.15a4.55 4.55 0 1 1-3.2-4.35v2.5a2.05 2.05 0 1 0 .7 1.55V3h2.5c.35 2.05 1.55 3.35 3.5 3.8v2.55A7.2 7.2 0 0 1 14 8.1V3Z"/><path fill="#FE2C55" d="M15.25 2.6v11.15a4.55 4.55 0 1 1-3.2-4.35v1.25a3.3 3.3 0 1 0 1.7 2.9V2.6Z"/><path fill="#fff" d="M14.62 3v10.55a3.3 3.3 0 1 1-2.57-3.22v1.1a2.2 2.2 0 1 0 1.47 2.07V3Z"/></svg> لمتابعة كل جديد: <b>play_zzone</b></p>
</div>

<script type="module">import "./chain_poops.js?ui=3";</script>

</html>
