<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 jailbreak — poops</title>
<style>
  :root { --bg:#1d3470; --panel:rgba(59,88,166,.86); --line:rgba(93,151,255,.28); --text:#edf4ff; --muted:#9aafd2; --cyan:#48caff; --violet:#8b6cff; }
  * { box-sizing:border-box; }
  html, body { min-height:100%; margin:0; background:radial-gradient(circle at 18% -15%,#6798ff 0,transparent 38%),radial-gradient(circle at 100% 100%,#986bd6 0,transparent 42%),var(--bg); color:var(--text); font:15px/1.5 "Segoe UI",system-ui,sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column; }
  #brand { flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:10px; min-height:66px; padding:11px 18px; background:rgba(29,52,112,.82); border-bottom:1px solid var(--line); box-shadow:0 8px 28px rgba(0,0,0,.25); backdrop-filter:blur(12px); }
  #brand b { color:#fff; font-size:17px; font-weight:800; letter-spacing:.18em; text-shadow:0 0 18px rgba(72,202,255,.45); }
  #wrap { width:min(480px, calc(100% - 32px)); max-width:480px; margin:auto; padding:28px 24px; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:0 18px 48px rgba(4,8,28,.24),inset 0 1px 0 rgba(255,255,255,.05); }
  #state { margin:0; font-size:25px; font-weight:800; }
  #det { display:block; margin:12px 0 0; color:#a9bde0; font-size:14px; }
  #det b { color:#fff; }
  #cache { display:block; margin:18px 0 0; padding:10px 14px; border:1px solid rgba(128,183,255,.35); border-radius:12px; background:rgba(9,20,59,.3); color:#d8e8ff; font-size:13px; }
  #cache.cacheok, .ok { color:#65e8b8; } .bad { color:#ff8398; } .warn { color:#ffd16e; }
  #version { position:fixed; right:0; bottom:18px; left:0; margin:0; color:#d8e5ff; font-size:12px; font-weight:700; letter-spacing:.12em; text-align:center; opacity:.9; }
</style>
</head>
<body>
<div id="brand"><b>PLAYZONE</b></div>
<div id="wrap">
  <div id="state">جارٍ التفعيل…</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>
<p id="version">V1.0</p>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = c === "bad" ? "تعذّر التفعيل" : c === "ok" ? "تم التفعيل" : "جارٍ التفعيل…"; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    function showOfflineReady() { setCache("اكتمل تحميل الملفات — 100%", true); stateEl.textContent = "اكتمل التحميل — أغلق المتصفح وأعد فتحه"; stateEl.className = "ok"; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    // CHAIN = POOPS (default). lapse only via explicit ?bug=lapse.
    var bug = (params.get("bug") === "lapse") ? "lapse" : "poops";
    detEl.innerHTML = "إصدار النظام: <b>" + (key || "غير معروف") + "</b> — البَقّ: <b>" + bug + "</b>";

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search + (location.search ? "&" : "?") + "ui=3";
    function go() { setState("loading " + bug + " chain...", "warn");
                    location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        showOfflineReady();
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("جارٍ تحميل الملفات للعمل بدون إنترنت… 0%"); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("جارٍ تحميل الملفات للعمل بدون إنترنت… " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () { showOfflineReady(); }, false);
        ac.addEventListener("updateready", function () { try { ac.swapCache(); } catch (e) {} showOfflineReady(); }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
