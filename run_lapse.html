<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLAYZONE GOLD — lapse</title>
<style>
/* ============ PLAYZONE GOLD v2 — run page (chain UI contract untouched) ============ */
:root{--gold:#e8c15a;--gold2:#f6dc86;--ink:#000;--panel:#0d0d0d;--line:rgba(232,193,90,.38);--text:#f4ecd9;--muted:#a3926d;--bad:#ff6b5e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
header#brand{width:100%;padding:13px 16px;text-align:center;border-bottom:1px solid var(--line);background:#020202}
#brand b{color:var(--gold);font-size:19px;font-weight:800;letter-spacing:.22em}
#brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.05em}
main{width:min(470px,calc(100% - 30px));max-width:470px;margin:34px auto 0;padding:26px 22px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:16px}
#state{margin:0;font-size:23px;font-weight:800;color:var(--gold2);min-height:34px}
#state.ok{color:var(--gold2)}#state.bad{color:var(--bad)}#state.warn{color:var(--gold)}
#fw{display:block;margin:18px 0 0;color:var(--muted);font-size:14px}
#fw b{color:var(--gold)}
#social{display:block;margin:8px 0 0;color:var(--muted);font-size:14px}
#social b{color:var(--gold);letter-spacing:.05em}
#out{display:none}
footer{width:100%;padding:14px 0;color:var(--muted);font-size:12px;text-align:center}
footer b{color:var(--gold)}
</style>
</head>
<body>
<header id="brand"><b>PLAYZONE</b><small>GOLD — Chain: LAPSE</small></header>
<main>
  <div id="state">جارٍ التفعيل… / Activating…</div>
  <div id="out"></div>
  <p id="fw"></p>
  <p id="social">لمتابعة كل جديد: <b>play_zzone</b> • Follow for updates</p>
</main>
<footer>PLAYZONE GOLD V2.0</footer>
<script>
(function(){try{var m=/PlayStation\s+4[\/ ](\d+)\.(\d+)/i.exec(navigator.userAgent);if(m){var n=parseInt(m[2],16),s=n.toString(16);if(s.length<2)s="0"+s;document.getElementById("fw").innerHTML="إصدار الجهاز — Device FW: <b>"+m[1]+"."+s+"</b>";}}catch(e){}})();
</script>
<script type="module">import "./chain_lapse.js?ui=3";</script>
</body>
</html>
